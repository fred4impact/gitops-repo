# Backend (Spring Boot) Rollout – canary strategy, prod only
# Namespace: springbook-prod
# Prerequisites: mysql-creds Secret, backend-config ConfigMap, and backend-stable-svc / backend-canary-svc Services must exist.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backendapp
  namespace: springbook-prod
  labels:
    app.kubernetes.io/name: backendapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: backendapp
  strategy:
    canary:
      canaryService: backend-canary-svc
      stableService: backend-stable-svc
      steps:
        - setWeight: 20
        - pause: { duration: 1m }
        - setWeight: 50
        - pause: { duration: 1m }
        - setWeight: 100
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backendapp
    spec:
      initContainers:
        - name: init-mydb
          image: busybox:1.28
          command:
            - sh
            - -c
            - "until nslookup mysql-svc.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for mydb; sleep 2; done"
      containers:
        - name: backendapp
          image: springbook-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-svc:3306/bookdb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-creds
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-creds
                  key: password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "validate"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 45
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 256Mi
