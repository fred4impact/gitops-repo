# Springbook Helm values – PROD
# Overrides for apps/springbook chart (mounted backend ConfigMap + MYSQL_* secret)

namespace: book-prod

# -- Backend
backend:
  enabled: true
  configMapName: backend-config
  replicas: 3                             # Increase for production HA
  image:
    repository: runtesting/backend-springbook
    tag: "v2"            
    pullPolicy: IfNotPresent
  service:
    nodePort: 32200
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  workDir: "/opt/bilarn"
  vaultSecretsConfigMapName: "backend-vault-placeholder"
  initWaitForMysql: true
  initImage: busybox:1.28
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 45
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 5

# -- Backend ConfigMap → /opt/bilarn/config/application.properties
backendConfig:
  logging:
    level_org_springframework: INFO
    level_com_mkyong: INFO
    level_com_zaxxer: WARN
    level_root: INFO
  management:
    endpointsExposure: health,info
    healthProbesEnabled: true
  datasource:
    hikariConnectionTimeout: 30000
    hikariMaximumPoolSize: 10
  jpa:
    hibernateDdlAuto: validate    # Validate only, never auto-create/drop schema

# -- Frontend
frontend:
  replicas: 3
  image:
    repository: runtesting/frontend-springbook
    tag: "v3"
    pullPolicy: IfNotPresent
  runtimeConfig:
    enabled: true
    configMapName: frontend-runtime-config
    # Set if the UI must call an absolute API URL; empty keeps in-cluster nginx routing
    apiBaseUrl: ""
  service:
    nodePort: 32201
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# -- MySQL
mysql:
  auth:
    username: bilarn
    password: password
    rootPassword: password
    database: bookdb
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  service:
    name: mysql-svc
    port: 3306