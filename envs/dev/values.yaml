# Springbook Helm values – DEV
# Overrides for apps/springbook chart (mounted backend ConfigMap + MYSQL_* secret)

namespace: book-dev

# -- Backend
backend:
  enabled: true
  configMapName: backend-config
  replicas: 1
  image:
    repository: runtesting/backend-springbook
    tag: "v2"
    pullPolicy: IfNotPresent
  service:
    nodePort: 32000
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  workDir: "/opt/bilarn"
  vaultSecretsConfigMapName: "backend-vault-placeholder"
  initWaitForMysql: true
  initImage: busybox:1.28
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 45
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 5

# -- Backend ConfigMap → /opt/bilarn/config/application.properties
backendConfig:
  logging:
    level_org_springframework: INFO
    level_com_mkyong: INFO
    level_com_zaxxer: WARN
    level_root: INFO
  management:
    endpointsExposure: health,info
    healthProbesEnabled: true
  datasource:
    hikariConnectionTimeout: 30000
    hikariMaximumPoolSize: 10
  jpa:
    hibernateDdlAuto: update

# -- Frontend
frontend:
  replicas: 2
  image:
    repository: runtesting/frontend-springbook
    tag: "v3"
    pullPolicy: IfNotPresent
  runtimeConfig:
    enabled: true
    configMapName: frontend-runtime-config
    # Empty = same-origin /books via nginx → backend-svc
    apiBaseUrl: ""
  service:
    nodePort: 32001
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 25m
      memory: 64Mi

# -- MySQL (DEV)
mysql:
  auth:
    username: bilarn
    password: password
    rootPassword: password
    database: bookdb
  resources: {}
  service:
    name: mysql-svc
    port: 3306